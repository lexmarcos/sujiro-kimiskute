name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) rather than 24.04 (2.39) so the binaries
          # also run on Debian 12 and Ubuntu 22.04.
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${tag}" != "v${crate_version}" ]]; then
            echo "Tag ${tag} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi
          # install.sh only accepts tags of this shape.
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag ${tag} is not installable by install.sh" >&2
            exit 1
          fi

      # Deliberately does NOT install libopus-dev: without it, libopus_sys
      # compiles its vendored Opus and links it statically, so the release
      # binary has no libopus0 runtime dependency. LIBOPUS_STATIC pins that
      # behaviour even if a future runner image ships libopus-dev.
      - name: Build release binary
        env:
          LIBOPUS_STATIC: "1"
        run: cargo build --locked --release

      - name: Package archive and checksum
        id: package
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          asset="sujiro-kimiskute-${tag}-${{ matrix.platform }}.tar.gz"

          mkdir -p stage dist
          cp target/release/sujiro-kimiskute stage/sujiro-kimiskute
          chmod 0755 stage/sujiro-kimiskute

          # install.sh requires the archive to contain exactly one entry named
          # "sujiro-kimiskute", so tar from inside the staging directory.
          tar --create --gzip --file "dist/${asset}" -C stage sujiro-kimiskute

          # install.sh matches the checksum line by basename, so generate it
          # from inside dist/ — a path here would break verification.
          ( cd dist && sha256sum "${asset}" > "${asset}.sha256" )

          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact the way install.sh will
        run: |
          set -euo pipefail
          asset="${{ steps.package.outputs.asset }}"

          entries="$(tar -tzf "dist/${asset}")"
          [[ "${entries}" == "sujiro-kimiskute" ]] || {
            echo "Archive must contain exactly one entry, got: ${entries}" >&2
            exit 1
          }

          ( cd dist && sha256sum --check --strict "${asset}.sha256" )

          if ldd stage/sujiro-kimiskute | grep -qi opus; then
            echo "Binary links libopus dynamically; install.sh would fail on hosts without libopus0" >&2
            ldd stage/sujiro-kimiskute >&2
            exit 1
          fi

          # Mirrors validate_bot_runtime in install.sh: exit 1 plus this message.
          set +e
          output="$(cd stage && timeout 5 env -i HOME="${HOME}" PATH=/usr/bin:/bin ./sujiro-kimiskute 2>&1)"
          status=$?
          set -e
          if [[ "${status}" -ne 1 ]] || ! grep -Fq 'required environment variable DISCORD_TOKEN is missing or empty' <<<"${output}"; then
            echo "Runtime compatibility check failed (exit ${status}):" >&2
            echo "${output}" >&2
            exit 1
          fi

          echo "glibc floor: $(objdump -T stage/sujiro-kimiskute | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"

          ls -l dist
          # Both platforms must be present; a half-published release would send
          # install.sh to a 404 for one architecture.
          for platform in linux-x86_64 linux-arm64; do
            for suffix in "" ".sha256"; do
              test -f "dist/sujiro-kimiskute-${tag}-${platform}.tar.gz${suffix}"
            done
          done

          gh release view "${tag}" >/dev/null 2>&1 \
            || gh release create "${tag}" --title "${tag}" --generate-notes

          gh release upload "${tag}" dist/* --clobber
