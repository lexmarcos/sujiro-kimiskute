name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A pull request that is pushed again should not keep an outdated run going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # songbird's `driver` feature links against libopus; see Dockerfile.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libopus-dev pkg-config

      # Pinned instead of `@stable` because `clippy -- -D warnings` is a hard
      # gate: a Rust release that adds or tightens a lint turns unrelated pull
      # requests red. Rust 1.98.0 did exactly that with `result_large_err`, and
      # it failed on code already released in v0.3.0. Bump this deliberately and
      # fix whatever the new toolchain reports in the same commit.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # `--locked` matches the release build: without it, linting may quietly
      # update Cargo.lock and check something the build step will not.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --locked --release
